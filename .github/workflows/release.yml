name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty for v<versionName>)'
        required: false
        default: ''
      release_name:
        description: 'Release title (leave empty for VeuxTorch v<versionName>)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version and release info
        id: version_info
        run: |
          set -euo pipefail
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' "app/build.gradle.kts")
          echo "Extracted version: $VERSION_NAME"

          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="v$VERSION_NAME"
          fi

          TITLE="${{ inputs.release_name }}"
          if [ -z "$TITLE" ]; then
            TITLE="VeuxTorch $TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Accept Android Licenses & Setup NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          else
            echo "Error: ANDROID_KEYSTORE_BASE64 secret is not configured"
            exit 1
          fi

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APK asset
        id: prepare_asset
        env:
          TAG: ${{ steps.version_info.outputs.tag }}
        run: |
          set -euo pipefail
          SRC=$(find "app/build/outputs/apk/release" -name "*.apk" | head -n1)
          DEST="app/build/outputs/apk/release/VeuxTorch-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "apk_path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: ${{ steps.version_info.outputs.title }}
          files: ${{ steps.prepare_asset.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
